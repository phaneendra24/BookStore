version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: postgrescontainer
    environment:
      POSTGRES_USER: phaneendra
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mypgdb
    ports:
      - "7200:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

volumes:
  book-postgres-data:
