version: "3.8"

services:
  mysql:
    image: mysql:latest
    container_name: mysqlcontainer
    environment:
      MYSQL_ROOT_PASSWORD: "pass"
      MYSQL_USER: mysql
      MYSQL_PASSWORD: "pass"
      MYSQL_DATABASE: mysqldb
    ports:
      - 3306:3306
    volumes:
      - ../mysql-data:/var/lib/mysql
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: phaneendra
      MINIO_ROOT_PASSWORD: StrongPass#2002
    command: server --console-address ":9001" /data

volumes:
  minio_storage: {}
